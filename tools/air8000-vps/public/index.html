<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirSIM Air8000 LAN Test</title>
<style>
body{font:15px system-ui;margin:24px;max-width:1100px;color:#18202a}input,button,select{padding:8px;margin:4px;border:1px solid #bbc4ce;border-radius:5px}button{cursor:pointer;background:#f5f7f9}.tabs{display:flex;gap:6px;border-bottom:1px solid #ccd4dc;margin:18px 0 12px;flex-wrap:wrap}.tab{border:0;border-bottom:3px solid transparent;background:white;border-radius:0}.tab.active{border-bottom-color:#1677d2;color:#075fae}.panel{display:none}.panel.active{display:block}.card{border:1px solid #ccd4dc;border-radius:8px;padding:14px;margin:12px 0}.muted{color:#687482}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:3px}.field input,.field select{margin:0}.status{padding:8px;border-radius:5px;background:#f5f7f9}.online{color:#087a39}.offline{color:#a12626}pre{white-space:pre-wrap;background:#f5f7f9;padding:10px;border-radius:5px}.phone-shell{max-width:360px;margin:0 auto;border:1px solid #ccd4dc;border-radius:24px;padding:18px;background:#f7f9fb;box-shadow:0 8px 24px #18202a18}.phone-display{width:calc(100% - 8px);box-sizing:border-box;text-align:center;font-size:28px;letter-spacing:2px;background:white;border-radius:12px;padding:14px 8px;margin:4px}.phone-status{text-align:center;margin:10px 0;color:#687482;min-height:22px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{height:58px;font-size:22px;border-radius:16px;background:white}.keypad small{display:block;font-size:10px;color:#687482}.phone-actions{display:flex;justify-content:center;gap:10px;margin-top:12px}.phone-actions button{border-radius:50%;width:58px;height:58px;font-size:22px}.phone-actions .call{background:#16a05d;color:white;border-color:#16a05d}.phone-actions .hang{background:#d64141;color:white;border-color:#d64141}.incoming-card{border:2px solid #c62828;border-radius:16px;padding:14px;text-align:center;background:#fff5f5;margin-bottom:12px}.incoming-card button{font-weight:600}

<h1>Air8000 LAN Test</h1>
<p class="muted">Real-device control panel. Wi‑Fi provisioning is sent to the Air8000 over its authenticated LAN WebSocket.</p>
<div id="secure-warning" class="status" style="display:none">BLE is blocked on this address. Open <a href="http://localhost:8080/">http://localhost:8080/</a> on the Windows PC, or use HTTPS. The LAN IP page is only for LAN controls.</div>
<label>Device <select id="device"></select></label>
<button onclick="refresh()">Refresh</button>
<div class="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="calls">Calls</button>
  <button class="tab" data-tab="sms">SMS</button>
  <button class="tab" data-tab="gps">GPS</button>
  <button class="tab" data-tab="wifi">Wi‑Fi setup</button>
</div>
<section id="overview" class="panel active"></section>
<section id="calls" class="panel"></section>
<section id="sms" class="panel"></section>
<section id="gps" class="panel"></section>
<section id="wifi" class="panel"></section>
<pre id="log"></pre>
<script>
const bootstrap=new URLSearchParams(location.hash.replace(/^#/,'')).get('token');
if(bootstrap){localStorage.airsimLanToken=bootstrap;history.replaceState(null,'',location.pathname+location.search)}
if(!window.isSecureContext){const warning=document.querySelector('#secure-warning');if(warning)warning.style.display='block'}
let devices=[]; const select=document.querySelector('#device');
let voice={ws:null,ctx:null,stream:null,source:null,processor:null,nextPlay:0,downlinkRate:8000,uplinkRate:16000,pending:new Int16Array(0),downlinkPackets:0};let voiceStatusText='Voice bridge stopped';
function auth(){return {Authorization:'Bearer '+(localStorage.airsimLanToken||''),'Content-Type':'application/json'}}
async function api(path,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(path,opt);const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function write(x){document.querySelector('#log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function current(){return devices.find(d=>d.device_id===select.value)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function events(type){return (current()?.events||[]).filter(e=>!type||e.type===type).slice().reverse()}
function eventRows(type){const rows=events(type);return rows.length?rows.map(e=>`<div class="status"><b>${esc(e.payload?.event||e.type)}</b> — ${esc(JSON.stringify(e.payload||{}))}</div>`).join(''):'<p class="muted">No live events received from the device.</p>'}
async function command(type,payload={}){const d=current();if(!d)return write('Select a connected Air8000 device first.');try{const result=await api('/api/devices/'+encodeURIComponent(d.device_id)+'/command',{method:'POST',body:JSON.stringify({type,payload})});write(result);if(!['dtmf','hangup','answer','reject'].includes(type))setTimeout(refresh,400);return result}catch(e){write(e.message);throw e}}
function incomingCall(){const latest=events('call.state')[0];return latest&&(latest.payload?.event==='incoming'||latest.payload?.call?.state==='INCOMING')?latest:null}
async function callAction(type,payload,button,label){if(button?.disabled)return;const old=button?.textContent||label;if(button){button.disabled=true;button.textContent=type==='hangup'?'Ended':'Sending…'}if(type==='hangup'||type==='reject'){activeCallState='ENDED';voiceStatus('Call ended');if(voice.ws)stopVoice().catch(()=>{})}try{await command(type,payload);if(button)button.textContent=type==='hangup'?'Ended':'Accepted';setTimeout(()=>{if(button){button.disabled=false;button.textContent=old}},700)}catch(e){if(button){button.disabled=false;button.textContent='Failed'}voiceStatus('Call command failed: '+e.message);setTimeout(()=>{if(button)button.textContent=old},1200)}}
function dialDigit(value){const el=document.querySelector('#call-number');if(!el)return;el.value=(el.value||'')+value;localStorage.setItem('airsimDialNumber',el.value)}
function clearDial(){const el=document.querySelector('#call-number');if(el){el.value='';localStorage.removeItem('airsimDialNumber')}}
function backspaceDial(){const el=document.querySelector('#call-number');if(el){el.value=(el.value||'').slice(0,-1);localStorage.setItem('airsimDialNumber',el.value)}}
let activeCallState='IDLE';
async function phoneKey(value,button){if(activeCallState==='CONNECTED'){await callAction('dtmf',{digit:value},button,'Sent')}else dialDigit(value)}
async function placeCall(button){try{const voicePromise=startVoice();await callAction('dial',{number:document.querySelector('#call-number')?.value||''},button,'Call');await voicePromise}catch(e){voiceStatus('Audio unavailable: '+e.message)}}
async function answerIncoming(button){if(button?.disabled)return;const old=button?.textContent||'Answer and start audio';if(button){button.disabled=true;button.textContent='Starting audio…'}try{const voicePromise=startVoice();await command('answer');await voicePromise;voiceStatus('Incoming call answered; microphone and speaker connected');if(button)button.textContent='Answered'}catch(e){voiceStatus('Answer/audio error: '+e.message);if(button)button.textContent='Failed'}setTimeout(()=>{if(button){button.disabled=false;button.textContent=old}},1800)}
function render(){const d=current();if(!d){['overview','calls','sms','gps'].forEach(id=>document.querySelector('#'+id).innerHTML='<p>No authenticated Air8000 connected.</p>');document.querySelector('#wifi').innerHTML=`<div class="card"><h2>BLE first-time provisioning</h2><p class="muted">No LAN device is required for first-time setup. Connect to the Air8000 over BLE, scan Wi‑Fi, then send credentials.</p><div class="grid"><div class="field"><label>BLE pairing code</label><input id="ble-pairing" value="000000" maxlength="6"></div><div class="field"><label>SSID</label><input id="wifi-ssid"></div><div class="field"><label>Password</label><input id="wifi-password" type="password"></div><div class="field"><label>BSSID (optional)</label><input id="wifi-bssid" placeholder="001122AABBCC"></div><div class="field"><label>Security</label><select id="wifi-security"><option>auto</option><option>wpa2</option><option>wpa2/wpa3</option><option>wpa3</option></select></div></div><button onclick="bleConnect()">Detect Air8000 over BLE</button><button onclick="bleScan()">Scan Wi‑Fi networks</button><button onclick="bleConnectWifi()">Send Wi‑Fi over BLE</button><div id="ble-status" class="status">BLE not connected</div><pre id="ble-networks"></pre></div>`;return}
document.querySelector('#overview').innerHTML=`<div class="card"><h2>${esc(d.device_id)}</h2><div>SN: ${esc(d.serial_number)||'-'} &nbsp; IMEI: ${esc(d.imei)||'-'}</div><p class="${d.connected?'online':'offline'}">${d.connected?'ONLINE':'OFFLINE'}</p><div class="grid"><div class="status">Wi‑Fi<br>${esc(JSON.stringify(d.wifi||{}))}</div><div class="status">GPS<br>${esc(JSON.stringify(d.location||{}))}</div><div class="status">Firmware<br>${esc(d.firmware||'-')}</div></div></div>`;
const incoming=incomingCall();const latestCall=events('call.state')[0];const savedDialNumber=localStorage.getItem('airsimDialNumber')||'';const rawCallState=latestCall?.payload?.call?.state||'IDLE';const localEnded=['hangup','reject','remote_hangup','ended'].includes(latestCall?.payload?.event);const callState=localEnded?'ENDED':rawCallState;activeCallState=callState;
const ms=d.media_stats||{};document.querySelector('#calls').innerHTML=`${incoming?`<div class="incoming-card"><h2>Incoming call</h2><p><b>${esc(incoming.payload?.call?.number||'Unknown number')}</b></p><button onclick="answerIncoming(this)">Answer</button><button onclick="callAction('reject',{},this,'Reject')">Reject</button></div>`:''}<div class="phone-shell"><h2 style="text-align:center;margin:0 0 8px">Phone</h2><input id="call-number" class="phone-display" type="tel" value="${esc(savedDialNumber)}" oninput="localStorage.setItem('airsimDialNumber',this.value)" placeholder="Enter number"><div class="phone-status">${esc(callState)} · ${esc(voiceStatusText)}</div><div class="keypad">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(k=>`<button onclick="phoneKey('${k[0]}',this)">${k[0]}<small>${k[1]}</small></button>`).join('')}</div><div class="phone-actions"><button onclick="backspaceDial()" title="Backspace">⌫</button><button class="call" onclick="placeCall(this)" title="Call">☎</button><button class="hang" onclick="callAction('hangup',{},this,'Hang up')" title="Hang up">✕</button></div><div style="text-align:center;margin-top:10px"><button onclick="clearDial()">Clear</button><button onclick="callAction('answer',{},this,'Answer')">Answer</button><button onclick="callAction('reject',{},this,'Reject')">Reject</button></div><div id="voice-status" class="status" style="margin-top:8px">${esc(voiceStatusText)}</div></div><div class="card"><h3>PCM diagnostics</h3><div class="grid"><div class="status">Remote party → browser<br>${esc(ms.downlink_frames||0)} frames · ${esc(ms.downlink_bytes||0)} bytes</div><div class="status">Browser mic → Air8000<br>${esc(ms.uplink_frames||0)} frames · ${esc(ms.uplink_bytes||0)} bytes</div><div class="status">Dropped before browser connected<br>${esc(ms.dropped_downlink_frames||0)} frames</div><div class="status">PCM rates<br>DL ${esc(d.media_rate||8000)} Hz · UL ${esc(d.media_uplink_rate||16000)} Hz</div></div></div><div class="card"><h3>Call history</h3>${eventRows('call.state')}</div>`;
document.querySelector('#sms').innerHTML=`<div class="card"><h2>SMS</h2><div class="grid"><div class="field"><label>Phone number</label><input id="sms-number"></div><div class="field"><label>Message</label><input id="sms-body"></div></div><button onclick="command('send_sms',{number:document.querySelector('#sms-number').value,body:document.querySelector('#sms-body').value})">Send SMS</button></div><div class="card"><h3>Received and sent SMS events</h3>${eventRows('sms.received')}${eventRows('sms.sent')}</div>`;
document.querySelector('#gps').innerHTML=`<div class="card"><h2>GPS</h2><p>${esc(JSON.stringify(d.location||{}))}</p><button onclick="command('gps_request')">Request GPS fix</button></div><div class="card"><h3>Latest command results</h3>${eventRows('device.command_result')}</div>`;
document.querySelector('#wifi').innerHTML=`<div class="card"><h2>BLE first-time provisioning</h2><p class="muted">Use this when the Air8000 has no Wi‑Fi yet. Chrome or Edge must be running on HTTPS or localhost, with Bluetooth enabled. The browser filters for the Air8000 provisioning service and reads the device identity before sending credentials.</p><div class="grid"><div class="field"><label>BLE pairing code</label><input id="ble-pairing" value="000000" maxlength="6"></div></div><button onclick="bleConnect()">Detect Air8000 over BLE</button><button onclick="bleScan()">Scan Wi‑Fi networks</button><div id="ble-status" class="status">BLE not connected</div><pre id="ble-networks"></pre></div><div class="card"><h2>Wi‑Fi credentials</h2><p class="muted">These fields can be sent either over BLE for first-time setup or over the LAN WebSocket after the device is online.</p><div class="grid"><div class="field"><label>SSID</label><input id="wifi-ssid" value="${esc(d.wifi?.ssid||'')}"></div><div class="field"><label>Password</label><input id="wifi-password" type="password"></div><div class="field"><label>BSSID (optional)</label><input id="wifi-bssid" placeholder="001122AABBCC"></div><div class="field"><label>Security</label><select id="wifi-security"><option>auto</option><option>wpa2</option><option>wpa2/wpa3</option><option>wpa3</option></select></div></div><button onclick="bleConnectWifi()">Send over BLE</button><button onclick="command('wifi_connect',{ssid:document.querySelector('#wifi-ssid').value,password:document.querySelector('#wifi-password').value,bssid:document.querySelector('#wifi-bssid').value,security:document.querySelector('#wifi-security').value})">Save and connect over LAN</button><button onclick="command('wifi_config')">Read saved Wi‑Fi</button><button onclick="command('wifi_disconnect')">Disconnect</button></div>`;
}
const BLE_UUID={service:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000001',status:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000002',config:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000003',identity:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000004',networks:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000005'};
let bleDevice=null,bleConfigChar=null,bleNetworks=[];
const bleDecoder=new TextDecoder(),bleEncoder=new TextEncoder();
function bleStatus(text){const el=document.querySelector('#ble-status');if(el)el.textContent=text}
function bleJson(event){try{return JSON.parse(bleDecoder.decode(event.target.value))}catch{return null}}
function handleBlePacket(event){const value=bleJson(event);if(!value)return;if(value.type==='wifi_network'){bleNetworks.push(value.network);const el=document.querySelector('#ble-networks');if(el)el.textContent=JSON.stringify(bleNetworks,null,2)}else if(value.wifi)bleStatus('BLE status: '+value.wifi.state+(value.wifi.error?' — '+value.wifi.error:''))}
async function bleConnect(){try{if(!window.isSecureContext||!navigator.bluetooth)throw Error('Web Bluetooth requires HTTPS or localhost in Chrome/Edge.');bleStatus('Opening Windows Bluetooth picker — select A8-......');bleDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE_UUID.service]});const server=await bleDevice.gatt.connect();const service=await server.getPrimaryService(BLE_UUID.service);bleConfigChar=await service.getCharacteristic(BLE_UUID.config);const statusChar=await service.getCharacteristic(BLE_UUID.status);const networksChar=await service.getCharacteristic(BLE_UUID.networks);statusChar.addEventListener('characteristicvaluechanged',handleBlePacket);networksChar.addEventListener('characteristicvaluechanged',handleBlePacket);await statusChar.startNotifications();await networksChar.startNotifications();const identity=await (await service.getCharacteristic(BLE_UUID.identity)).readValue();bleStatus('Connected: '+bleDecoder.decode(identity));}catch(e){bleStatus('BLE error: '+e.message)}}
async function bleWrite(payload){if(!bleConfigChar)throw Error('Connect to an Air8000 over BLE first.');await bleConfigChar.writeValueWithResponse(bleEncoder.encode(JSON.stringify(payload)))}
async function bleScan(){try{bleNetworks=[];const el=document.querySelector('#ble-networks');if(el)el.textContent='Scanning…';await bleWrite({pairing_code:document.querySelector('#ble-pairing').value,op:'scan'});bleStatus('BLE scan requested; waiting for networks…')}catch(e){bleStatus('BLE error: '+e.message)}}
async function bleConnectWifi(){try{await bleWrite({pairing_code:document.querySelector('#ble-pairing').value,op:'connect',ssid:document.querySelector('#wifi-ssid').value,password:document.querySelector('#wifi-password').value,bssid:document.querySelector('#wifi-bssid').value,security:document.querySelector('#wifi-security').value});bleStatus('BLE Wi‑Fi credentials sent; waiting for connection…')}catch(e){bleStatus('BLE error: '+e.message)}}
async function refresh(){try{devices=await api('/api/devices');select.innerHTML=devices.map(d=>`<option value="${esc(d.device_id)}">${esc(d.device_id)} — ${d.connected?'online':'offline'}</option>`).join('');if(!devices.length)select.innerHTML='<option value="">No device</option>';render()}catch(e){write(e.message)}}
function voiceStatus(text){voiceStatusText=text;const el=document.querySelector('#voice-status');if(el)el.textContent=text}
function downsample(input,fromRate,toRate){const ratio=fromRate/toRate;const length=Math.max(1,Math.round(input.length/ratio));const out=new Int16Array(length);for(let i=0;i<length;i++){const start=Math.floor(i*ratio),end=Math.min(input.length,Math.floor((i+1)*ratio));let sum=0,count=0;for(let j=start;j<end;j++){sum+=input[j];count++}const sample=count?sum/count:0;out[i]=Math.max(-1,Math.min(1,sample))*0x7fff}return out.buffer}
function sendMicPcm(buffer){if(!voice.ws||voice.ws.readyState!==WebSocket.OPEN)return;const incoming=new Int16Array(buffer);const pending=voice.pending||new Int16Array(0);const merged=new Int16Array(pending.length+incoming.length);merged.set(pending);merged.set(incoming,pending.length);const frameSamples=Math.max(160,Math.round(voice.uplinkRate*0.02));let offset=0;while(offset+frameSamples<=merged.length){voice.ws.send(merged.slice(offset,offset+frameSamples).buffer);offset+=frameSamples}voice.pending=merged.slice(offset)}
async function playPcm(buffer){if(!voice.ctx)return;if(voice.ctx.state!=='running')await voice.ctx.resume();if(!(buffer instanceof ArrayBuffer)||buffer.byteLength<2)return;const samples=new Int16Array(buffer);const audio=voice.ctx.createBuffer(1,samples.length,voice.downlinkRate);const channel=audio.getChannelData(0);for(let i=0;i<samples.length;i++)channel[i]=samples[i]/32768;const source=voice.ctx.createBufferSource();source.buffer=audio;source.connect(voice.ctx.destination);const now=voice.ctx.currentTime;voice.nextPlay=Math.max(now,voice.nextPlay||now);source.start(voice.nextPlay);voice.nextPlay+=audio.duration}
async function startVoice(){const d=current();if(!d)throw Error('Select a connected Air8000 device first.');try{voiceStatus('Starting microphone / speaker…');if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone requires HTTPS or http://localhost:8080. Open the portal on the Windows PC using http://localhost:8080, or configure HTTPS for the LAN address.');if(voice.ws)await stopVoice();const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw Error('Web Audio is unavailable');voice.ctx=new AudioContextClass();await voice.ctx.resume();voice.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const ticket=await api('/api/devices/'+encodeURIComponent(d.device_id)+'/media-ticket',{method:'POST'});voice.downlinkRate=Number(ticket.downlink_sample_rate||ticket.sample_rate)===16000?16000:8000;voice.uplinkRate=Number(ticket.uplink_sample_rate)===8000?8000:16000;voice.pending=new Int16Array(0);voice.downlinkPackets=0;voice.ws=new WebSocket(ticket.ws_url);voice.ws.binaryType='arraybuffer';voice.ws.onmessage=async e=>{let data=e.data;if(data instanceof Blob)data=await data.arrayBuffer();if(data instanceof ArrayBuffer){voice.downlinkPackets++;if(voice.downlinkPackets===1)voiceStatus('Speaker receiving Air8000 audio · DL '+voice.downlinkRate+' Hz / UL '+voice.uplinkRate+' Hz');try{await playPcm(data)}catch(err){voiceStatus('Speaker error: '+err.message)}}};voice.ws.onclose=()=>voiceStatus('Voice bridge disconnected');await new Promise((resolve,reject)=>{voice.ws.onopen=resolve;voice.ws.onerror=()=>reject(Error('media WebSocket failed'))});await voice.ctx.resume();voice.source=voice.ctx.createMediaStreamSource(voice.stream);voice.processor=voice.ctx.createScriptProcessor(2048,1,1);voice.processor.onaudioprocess=e=>sendMicPcm(downsample(e.inputBuffer.getChannelData(0),voice.ctx.sampleRate,voice.uplinkRate));const mute=voice.ctx.createGain();mute.gain.value=0;voice.source.connect(voice.processor);voice.processor.connect(mute);mute.connect(voice.ctx.destination);voiceStatus('Live two-way voice connected · DL '+voice.downlinkRate+' Hz / UL '+voice.uplinkRate+' Hz');}catch(e){await stopVoice();voiceStatus('Voice error: '+e.message);throw e}}
async function stopVoice(){if(voice.processor)voice.processor.disconnect();if(voice.source)voice.source.disconnect();if(voice.stream)voice.stream.getTracks().forEach(t=>t.stop());if(voice.ctx)await voice.ctx.close();if(voice.ws)voice.ws.close();voice={ws:null,ctx:null,stream:null,source:null,processor:null,nextPlay:0,downlinkRate:8000,uplinkRate:16000,pending:new Int16Array(0),downlinkPackets:0};voiceStatus('Voice bridge stopped')}
function simplifyBleForm(){const pairing=document.querySelector('#ble-pairing');if(pairing)pairing.closest('.field')?.style.setProperty('display','none');const bssid=document.querySelector('#wifi-bssid');if(bssid)bssid.closest('.field')?.style.setProperty('display','none');const security=document.querySelector('#wifi-security');if(security)security.closest('.field')?.style.setProperty('display','none');const scan=[...document.querySelectorAll('button')].find(b=>/scan wi/i.test(b.textContent));if(scan)scan.style.display='none';const send=[...document.querySelectorAll('button')].find(b=>/send.*ble/i.test(b.textContent));if(send)send.style.display='none';const ssid=document.querySelector('#wifi-ssid');if(!ssid)return;let picker=document.querySelector('#ble-ssid');if(!picker){picker=document.createElement('select');picker.id='ble-ssid';picker.style.minWidth='240px';picker.innerHTML='<option value="">Connect over BLE to scan networks</option>';picker.onchange=()=>{ssid.value=picker.value;const network=bleNetworks.find(n=>n.ssid===picker.value);if(bssid)bssid.value=network?.bssid||'';if(security)security.value=network?.security||'auto'};ssid.style.display='none';ssid.parentElement?.insertBefore(picker,ssid)}if(!document.querySelector('#ble-submit')){const submit=document.createElement('button');submit.id='ble-submit';submit.textContent='Connect Air8000 to selected Wi-Fi';submit.onclick=bleConnectWifi;const host=document.querySelector('#wifi-password')?.closest('.field')?.parentElement||document.querySelector('#wifi');host?.appendChild(submit)}}
function ensureBlePicker(){let picker=document.querySelector('#ble-ssid');if(picker)return picker;const ssid=document.querySelector('#wifi-ssid');if(!ssid)return null;picker=document.createElement('select');picker.id='ble-ssid';picker.style.minWidth='240px';picker.setAttribute('aria-label','Scanned Wi-Fi networks');picker.onchange=()=>{ssid.value=picker.value;const network=bleNetworks.find(n=>n.ssid===picker.value);const bssid=document.querySelector('#wifi-bssid');const security=document.querySelector('#wifi-security');if(bssid)bssid.value=network?.bssid||'';if(security)security.value=network?.security||'auto'};ssid.style.display='none';ssid.parentElement?.insertBefore(picker,ssid);return picker}
function populateBleNetworks(){const picker=ensureBlePicker();if(!picker)return;const current=picker.value;picker.innerHTML=bleNetworks.map(n=>`<option value="${esc(n.ssid)}">${esc(n.ssid)}${n.rssi==null?'':` (${n.rssi} dBm)`}</option>`).join('')||'<option value="">No Wiâ€‘Fi networks found</option>';if(current&&[...picker.options].some(o=>o.value===current))picker.value=current;picker.dispatchEvent(new Event('change'));const el=document.querySelector('#ble-networks');if(el)el.textContent=bleNetworks.length?`Found ${bleNetworks.length} Wiâ€‘Fi network(s). Select one above, enter the password, then connect.`:'No Wiâ€‘Fi networks found.'}
const BLE_PAIRING_CODE='000000';
const oldBlePacket=handleBlePacket;
handleBlePacket=function(event){const value=bleJson(event);if(value?.type==='wifi_network'){if(value.network&&!bleNetworks.some(n=>n.ssid===value.network.ssid&&n.bssid===value.network.bssid))bleNetworks.push(value.network);populateBleNetworks();const el=document.querySelector('#ble-networks');if(el)el.textContent=bleNetworks.length?`${bleNetworks.length} Wiâ€‘Fi network(s) found. Choose one above.`:'No Wiâ€‘Fi networks found.';return}oldBlePacket(event);if(value?.ble)bleStatus('Bluetooth status: '+value.ble.state);if(value?.wifi)bleStatus('Bluetooth status: '+(value.ble?.state||'connected')+' — Wi-Fi status: '+value.wifi.state+(value.wifi.error?' — '+value.wifi.error:''))};
const oldBleConnect=bleConnect;
bleConnect=async function(){await oldBleConnect();if(bleDevice)bleDevice.addEventListener('gattserverdisconnected',()=>{bleConfigChar=null;bleStatus('Bluetooth disconnected');});if(bleConfigChar){try{await bleWrite({pairing_code:BLE_PAIRING_CODE,op:'scan'});bleStatus('Bluetooth connected; scanning Wiâ€‘Fi networks…')}catch(e){bleStatus('BLE scan error: '+e.message)}}};
bleScan=async function(){try{bleNetworks=[];await bleWrite({pairing_code:BLE_PAIRING_CODE,op:'scan'});bleStatus('Scanning Wiâ€‘Fi networks…')}catch(e){bleStatus('BLE error: '+e.message)}};
bleConnectWifi=async function(){try{const picker=document.querySelector('#ble-ssid');const ssid=picker?.value||document.querySelector('#wifi-ssid')?.value||'';const network=bleNetworks.find(n=>n.ssid===ssid);if(!ssid)throw Error('Choose a Wiâ€‘Fi network first.');await bleWrite({pairing_code:BLE_PAIRING_CODE,op:'connect',ssid,password:document.querySelector('#wifi-password').value,bssid:network?.bssid||'',security:network?.security||'auto'});bleStatus('Wiâ€‘Fi credentials sent; the Air8000 is connecting…')}catch(e){bleStatus('BLE error: '+e.message)}};
const wifiObserver=new MutationObserver(simplifyBleForm);wifiObserver.observe(document.querySelector('#wifi'),{childList:true,subtree:true});
select.addEventListener('change',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});
const originalRender=render;render=function(){if(bleDevice?.gatt?.connected&&document.querySelector('#ble-status'))return;originalRender()};
refresh();setInterval(refresh,1000);
</script>
