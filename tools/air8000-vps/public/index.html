<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirSIM Air8000 LAN Test</title>
<style>
body{font:15px system-ui;margin:24px;max-width:1100px;color:#18202a}input,button,select{padding:8px;margin:4px;border:1px solid #bbc4ce;border-radius:5px}button{cursor:pointer;background:#f5f7f9}.tabs{display:flex;gap:6px;border-bottom:1px solid #ccd4dc;margin:18px 0 12px;flex-wrap:wrap}.tab{border:0;border-bottom:3px solid transparent;background:white;border-radius:0}.tab.active{border-bottom-color:#1677d2;color:#075fae}.panel{display:none}.panel.active{display:block}.card{border:1px solid #ccd4dc;border-radius:8px;padding:14px;margin:12px 0}.muted{color:#687482}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:3px}.field input,.field select{margin:0}.status{padding:8px;border-radius:5px;background:#f5f7f9}.online{color:#087a39}.offline{color:#a12626}pre{white-space:pre-wrap;background:#f5f7f9;padding:10px;border-radius:5px}.phone-shell{max-width:360px;margin:0 auto;border:1px solid #ccd4dc;border-radius:24px;padding:18px;background:#f7f9fb;box-shadow:0 8px 24px #18202a18}.phone-display{width:calc(100% - 8px);box-sizing:border-box;text-align:center;font-size:28px;letter-spacing:2px;background:white;border-radius:12px;padding:14px 8px;margin:4px}.phone-status{text-align:center;margin:10px 0;color:#687482;min-height:22px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{height:58px;font-size:22px;border-radius:16px;background:white}.keypad small{display:block;font-size:10px;color:#687482}.phone-actions{display:flex;justify-content:center;gap:10px;margin-top:12px}.phone-actions button{border-radius:50%;width:58px;height:58px;font-size:22px}.phone-actions .call{background:#16a05d;color:white;border-color:#16a05d}.phone-actions .hang{background:#d64141;color:white;border-color:#d64141}.incoming-card{border:2px solid #c62828;border-radius:16px;padding:14px;text-align:center;background:#fff5f5;margin-bottom:12px}.incoming-card button{font-weight:600}
</style>
<h1>Air8000 LAN Test</h1>
<p class="muted">Real-device control panel. Wi-Fi provisioning is sent to the Air8000 over its authenticated LAN WebSocket.</p>
<div id="secure-warning" class="status" style="display:none">BLE is blocked on this address. Open <a href="http://localhost:8081/">http://localhost:8081/</a> on the Windows PC, or use HTTPS. The LAN IP page is only for LAN controls.</div>
<label>Device <select id="device"></select></label>
<button onclick="refresh()">Refresh</button>
<div class="tabs">
  <button class="tab active" data-tab="overview">Overview</button>
  <button class="tab" data-tab="calls">Calls</button>
  <button class="tab" data-tab="sms">SMS</button>
  <button class="tab" data-tab="gps">GPS</button>
  <button class="tab" data-tab="wifi">Wi-Fi setup</button>
</div>
<section id="overview" class="panel active"></section>
<section id="calls" class="panel"></section>
<section id="sms" class="panel"></section>
<section id="gps" class="panel"></section>
<section id="wifi" class="panel"></section>
<pre id="log"></pre>
<script>
const bootstrap=new URLSearchParams(location.hash.replace(/^#/,'')).get('token');
if(bootstrap){localStorage.airsimLanToken=bootstrap;history.replaceState(null,'',location.pathname+location.search)}
if(!window.isSecureContext){const warning=document.querySelector('#secure-warning');if(warning)warning.style.display='block'}
let devices=[]; const select=document.querySelector('#device');
let voice=createVoiceState();let voiceStatusText='Voice bridge stopped';
function auth(){return {Authorization:'Bearer '+(localStorage.airsimLanToken||''),'Content-Type':'application/json'}}
let hostBlePairingCode='654321';
async function api(path,opt={}){opt.headers={...auth(),...(opt.headers||{})};const r=await fetch(path,opt);const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
async function loadBlePairingCode(){try{const value=await api('/api/ble-config');hostBlePairingCode=value.pairing_code||'';const input=document.querySelector('#ble-pairing');if(input)input.value=hostBlePairingCode}catch{} }
function write(x){document.querySelector('#log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function current(){return devices.find(d=>d.device_id===select.value)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function events(type){return (current()?.events||[]).filter(e=>!type||e.type===type).slice().reverse()}
function eventRows(type){const rows=events(type);return rows.length?rows.map(e=>`<div class="status"><b>${esc(e.payload?.event||e.type)}</b> — ${esc(JSON.stringify(e.payload||{}))}</div>`).join(''):'<p class="muted">No live events received from the device.</p>'}
async function command(type,payload={}){const d=current();if(!d)return write('Select a connected Air8000 device first.');try{const result=await api('/api/devices/'+encodeURIComponent(d.device_id)+'/command',{method:'POST',body:JSON.stringify({type,payload})});write(result);if(type==='audio_guard'){const panel=document.querySelector('#calls');if(panel){const next=payload.enabled===false?'OFF (pending device reply)':'ON (pending device reply)';panel.innerHTML=panel.innerHTML.replace(/(CC downlink guard:\s*<b>)[^<]*/,'$1'+next)}setTimeout(async()=>{try{devices=await api('/api/devices');const live=devices.find(x=>x.device_id===d.device_id);const currentPanel=document.querySelector('#calls');if(currentPanel&&live){const next=live.cc_downlink_guard===true?'ON':live.cc_downlink_guard===false?'OFF':'unknown';currentPanel.innerHTML=currentPanel.innerHTML.replace(/(CC downlink guard:\s*<b>)[^<]*/,'$1'+next)}}catch{}},1200)}else if(!['dtmf','hangup','answer','reject'].includes(type))setTimeout(refresh,400);return result}catch(e){write(e.message);throw e}}
function incomingCall(){const latest=events('call.state')[0];return latest&&(latest.payload?.event==='incoming'||latest.payload?.call?.state==='INCOMING')?latest:null}
async function callAction(type,payload,button,label){if(button?.disabled)return;const old=button?.textContent||label;if(button){button.disabled=true;button.textContent=type==='hangup'?'Ended':'Sending…'}if(type==='hangup'||type==='reject'){activeCallState='ENDED';voiceStatus('Call ended');if(voice.wantActive||voice.ctx)stopVoice().catch(()=>{})}try{await command(type,payload);if(button)button.textContent=type==='hangup'?'Ended':'Accepted';setTimeout(()=>{if(button){button.disabled=false;button.textContent=old}},700)}catch(e){if(button){button.disabled=false;button.textContent='Failed'}voiceStatus('Call command failed: '+e.message);setTimeout(()=>{if(button)button.textContent=old},1200)}}
function dialDigit(value){const el=document.querySelector('#call-number');if(!el)return;el.value=(el.value||'')+value;localStorage.setItem('airsimDialNumber',el.value)}
function clearDial(){const el=document.querySelector('#call-number');if(el){el.value='';localStorage.removeItem('airsimDialNumber')}}
function backspaceDial(){const el=document.querySelector('#call-number');if(el){el.value=(el.value||'').slice(0,-1);localStorage.setItem('airsimDialNumber',el.value)}}
let activeCallState='IDLE';
async function phoneKey(value,button){if(activeCallState==='CONNECTED'){await callAction('dtmf',{digit:value},button,'Sent')}else dialDigit(value)}
async function placeCall(button){try{const d=current();await startVoice();if(d?.voice_mode==='wideband')startLocalRingback();voiceStatus('Carrier media armed — dialing…');await callAction('dial',{number:document.querySelector('#call-number')?.value||''},button,'Call')}catch(e){voiceStatus('Audio unavailable: '+e.message)}}
async function answerIncoming(button){if(button?.disabled)return;const old=button?.textContent||'Answer and start audio';if(button){button.disabled=true;button.textContent='Starting audio…'}try{await startVoice();stopLocalRingback();await command('answer');voiceStatus('Incoming call answered; carrier audio connected');if(button)button.textContent='Answered'}catch(e){voiceStatus('Answer/audio error: '+e.message);if(button)button.textContent='Failed'}setTimeout(()=>{if(button){button.disabled=false;button.textContent=old}},1800)}
function fmtNumber(value,digits=1){const n=Number(value);return Number.isFinite(n)?n.toFixed(digits):'-'}
function fmtCoord(value){const n=Number(value);return Number.isFinite(n)?n.toFixed(7):'-'}
function render(){const d=current();if(!d){['overview','calls','sms','gps'].forEach(id=>document.querySelector('#'+id).innerHTML='<p>No authenticated Air8000 connected.</p>');document.querySelector('#wifi').innerHTML=`<div class="card"><h2>BLE first-time provisioning</h2><p class="muted">No LAN device is required for first-time setup. Connect to the Air8000 over BLE, scan Wi-Fi, then send credentials.</p><div class="grid"><div class="field"><label>BLE pairing code</label><input id="ble-pairing" value="000000" maxlength="6"></div><div class="field"><label>SSID</label><input id="wifi-ssid"></div><div class="field"><label>Password</label><input id="wifi-password" type="password"></div><div class="field"><label>BSSID (optional)</label><input id="wifi-bssid" placeholder="001122AABBCC"></div><div class="field"><label>Security</label><select id="wifi-security"><option>auto</option><option>wpa2</option><option>wpa2/wpa3</option><option>wpa3</option></select></div></div><button onclick="bleConnect()">Detect Air8000 over BLE</button><button onclick="bleScan()">Scan Wi-Fi networks</button><button onclick="bleConnectWifi()">Send Wi-Fi over BLE</button><div id="ble-status" class="status">BLE not connected</div><pre id="ble-networks"></pre></div>`;return}const w=d.wifi||{};const g=d.location||{};
document.querySelector('#overview').innerHTML=`<div class="card"><h2>${esc(d.device_id)}</h2><div>SN: ${esc(d.serial_number)||'-'} &nbsp; IMEI: ${esc(d.imei)||'-'}</div><p class="${d.connected?'online':'offline'}">${d.connected?'ONLINE':'OFFLINE'}</p><div class="grid"><div class="status"><b>Wi-Fi</b><br>State: ${esc(w.state||'awaiting telemetry')}<br>SSID: ${esc(w.ssid||'-')}<br>IP: ${esc(w.ip||'-')}<br>RSSI: ${w.rssi==null?'-':esc(w.rssi)+' dBm'}</div><div class="status"><b>GNSS</b><br>State: ${esc(g.fix_state||d.status?.gnss_state||'idle')}<br>Lat: ${fmtCoord(g.latitude)}<br>Lon: ${fmtCoord(g.longitude)}<br>Satellites: ${esc(g.satellites??g.satellites_visible??'-')}</div><div class="status"><b>Firmware</b><br>${esc(d.firmware||'-')}<br>Last seen: ${d.last_seen?new Date(d.last_seen).toLocaleTimeString():'-'}</div></div></div>`;
const incoming=incomingCall();const latestCall=events('call.state')[0];const savedDialNumber=localStorage.getItem('airsimDialNumber')||'';const rawCallState=latestCall?.payload?.call?.state||'IDLE';const localEnded=['hangup','reject','remote_hangup','ended'].includes(latestCall?.payload?.event);const callState=localEnded?'ENDED':rawCallState;activeCallState=callState;
const ms=d.media_stats||{};document.querySelector('#calls').innerHTML=`${incoming?`<div class="incoming-card"><h2>Incoming call</h2><p><b>${esc(incoming.payload?.call?.number||'Unknown number')}</b></p><button onclick="answerIncoming(this)">Answer</button><button onclick="callAction('reject',{},this,'Reject')">Reject</button></div>`:''}<div class="phone-shell"><h2 style="text-align:center;margin:0 0 8px">Phone</h2><input id="call-number" class="phone-display" type="tel" value="${esc(savedDialNumber)}" oninput="localStorage.setItem('airsimDialNumber',this.value)" placeholder="Enter number"><div class="phone-status">${esc(callState)} · ${esc(voiceStatusText)}</div><div class="keypad">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']].map(k=>`<button onclick="phoneKey('${k[0]}',this)">${k[0]}<small>${k[1]}</small></button>`).join('')}</div><div class="phone-actions"><button onclick="backspaceDial()" title="Backspace">⌫</button><button class="call" onclick="placeCall(this)" title="Call">☎</button><button class="hang" onclick="callAction('hangup',{},this,'Hang up')" title="Hang up">✕</button></div><div style="text-align:center;margin-top:10px"><button onclick="clearDial()">Clear</button><button onclick="callAction('answer',{},this,'Answer')">Answer</button><button onclick="callAction('reject',{},this,'Reject')">Reject</button></div><div id="voice-status" class="status" style="margin-top:8px">${esc(voiceStatusText)}</div></div><div class="card"><h3>PCM diagnostics</h3><div class="grid"><div class="status">Remote party → browser<br>${esc(ms.downlink_frames||0)} frames · ${esc(ms.downlink_bytes||0)} bytes</div><div class="status">Browser mic → Air8000<br>${esc(ms.uplink_frames||0)} frames · ${esc(ms.uplink_bytes||0)} bytes</div><div class="status">Dropped before browser connected<br>${esc(ms.dropped_downlink_frames||0)} frames</div><div class="status">SIP/RTP media<br>DL ${esc(d.media_rate||8000)} Hz · UL ${esc(d.media_uplink_rate||8000)} Hz · 20 ms</div><div class="status">Cellular VoLTE<br>${d.cellular_voice_rate?esc(d.cellular_voice_rate)+' Hz · '+esc(d.voice_codec||''):'Negotiating'}${d.wideband_volte?' · WIDEBAND':''}</div><div class="status">RTP jitter<br>${esc(ms.rtp_jitter_ms||0)} ms · lost ${esc(ms.rtp_lost_packets||0)} · late ${esc(ms.rtp_late_packets||0)}</div><div class="status">Audio recovery<br>conceal ${esc(ms.audio_concealment_frames||0)} · UL drops ${esc(ms.uplink_dropped_frames||0)} · browser underruns ${esc(voice.playUnderruns||0)} · browser queue drops ${esc(voice.playDrops||0)} · server resumes ${esc(d.media_recovery_count||0)} · DL latency trims ${esc(ms.rtp_latency_trim_frames||0)} · UL underruns ${esc(ms.uplink_underrun_frames||0)} · RTP resyncs ${esc(ms.rtp_stream_resets||0)} · device cushion ${esc(ms.uplink_cushion_frames||0)}</div><div class="status">Air8000 bridge rate (expect 50/s)<br>device sends ${d.voip_stats?.tx_pps!=null?esc(d.voip_stats.tx_pps)+'/s':'waiting for 5 s report'} · device receives ${d.voip_stats?.rx_pps!=null?esc(d.voip_stats.rx_pps)+'/s':'—'} · gateway receives ${esc(ms.rtp_rx_pps||0)}/s (${esc(ms.rtp_rx_packets||0)} pkts) · gateway-inserted silence ${esc(ms.rtp_idle_frames||0)} frames · cc.quality ${esc(d.voip_stats?.cc_quality??'—')}</div><div class="status">CC downlink guard: <b>${d.cc_downlink_guard===true?'ON':d.cc_downlink_guard===false?'OFF':'unknown'}</b><br><button onclick="command('audio_guard',{enabled:true})">Guard ON</button><button onclick="command('audio_guard',{enabled:false})">Guard OFF</button></div><div class="status">Ringback/media<br>${d.real_early_media?'CC/SIP bridge active':'Post-answer PCM only'}</div></div></div><div class="card"><h3>Call history</h3>${eventRows('call.state')}</div>`;
document.querySelector('#sms').innerHTML=`<div class="card"><h2>SMS</h2><div class="grid"><div class="field"><label>Phone number</label><input id="sms-number"></div><div class="field"><label>Message</label><input id="sms-body"></div></div><button onclick="command('send_sms',{number:document.querySelector('#sms-number').value,body:document.querySelector('#sms-body').value})">Send SMS</button></div><div class="card"><h3>Received and sent SMS events</h3>${eventRows('sms.received')}${eventRows('sms.sent')}</div>`;
document.querySelector('#gps').innerHTML=`<div class="card"><h2>GNSS</h2><div class="grid"><div class="status"><b>Receiver</b><br>${esc(g.fix_state||d.status?.gnss_state||'idle')}${g.error?'<br><small>'+esc(g.error)+'</small>':''}</div><div class="status"><b>Latitude</b><br>${fmtCoord(g.latitude)}</div><div class="status"><b>Longitude</b><br>${fmtCoord(g.longitude)}</div><div class="status"><b>Altitude</b><br>${g.altitude_m==null?'-':fmtNumber(g.altitude_m,1)+' m'}</div><div class="status"><b>Satellites used</b><br>${esc(g.satellites??'-')}</div><div class="status"><b>Satellites visible</b><br>${esc(g.satellites_visible??'-')}</div><div class="status"><b>HDOP</b><br>${g.hdop==null?'-':fmtNumber(g.hdop,2)}</div><div class="status"><b>Speed</b><br>${g.speed_mps==null?'-':fmtNumber(g.speed_mps,2)+' m/s'}</div></div><button onclick="command('gps_request')">Request real GNSS fix</button><p class="muted">The device reports searching/fixed/lost live; a cold fix can take tens of seconds.</p></div><div class="card"><h3>GNSS telemetry history</h3>${eventRows('device.location')}${eventRows('device.command_result')}</div>`;
document.querySelector('#wifi').innerHTML=`<div class="card"><h2>Live Wi-Fi status</h2><div class="grid"><div class="status"><b>State</b><br>${esc(w.state||'awaiting telemetry')}</div><div class="status"><b>SSID</b><br>${esc(w.ssid||'-')}</div><div class="status"><b>IPv4</b><br>${esc(w.ip||'-')}</div><div class="status"><b>Gateway</b><br>${esc(w.gateway||'-')}</div><div class="status"><b>RSSI</b><br>${w.rssi==null?'-':esc(w.rssi)+' dBm'}</div><div class="status"><b>BSSID</b><br>${esc(w.bssid||'-')}</div></div><p class="muted">Connected is reported only after the Air8000 has an IP address, not merely after wlan.connect() accepted the request.</p></div><div class="card"><h2>BLE first-time provisioning</h2><p class="muted">Use this when the Air8000 has no Wi-Fi yet. Chrome or Edge must be running on HTTPS or localhost, with Bluetooth enabled.</p><div class="grid"><div class="field"><label>BLE pairing code</label><input id="ble-pairing" value="000000" maxlength="6"></div></div><button onclick="bleConnect()">Detect Air8000 over BLE</button><button onclick="bleScan()">Scan Wi-Fi networks</button><div id="ble-status" class="status">${esc(bleStatusText)}</div><pre id="ble-networks"></pre></div><div class="card"><h2>Wi-Fi credentials</h2><div class="grid"><div class="field"><label>SSID</label><input id="wifi-ssid" value="${esc(w.ssid||'')}"></div><div class="field"><label>Password</label><input id="wifi-password" type="password"></div><div class="field"><label>BSSID (optional)</label><input id="wifi-bssid" value="${esc(w.bssid||'')}" placeholder="001122AABBCC"></div><div class="field"><label>Security</label><select id="wifi-security"><option>auto</option><option>wpa2</option><option>wpa2/wpa3</option><option>wpa3</option></select></div></div><button onclick="bleConnectWifi()">Send over BLE</button><button onclick="command('wifi_connect',{ssid:document.querySelector('#wifi-ssid').value,password:document.querySelector('#wifi-password').value,bssid:document.querySelector('#wifi-bssid').value,security:document.querySelector('#wifi-security').value})">Save and connect over LAN</button><button onclick="command('wifi_config')">Refresh Wi-Fi status</button><button onclick="command('wifi_disconnect')">Disconnect</button></div><div class="card"><h3>Wi-Fi telemetry history</h3>${eventRows('device.wifi')}</div>`;
}
const BLE_UUID={service:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000001',status:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000002',config:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000003',identity:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000004',networks:'7b9e8000-a8f0-4c4e-9a5b-4b80c8000005'};
let bleDevice=null,bleConfigChar=null,bleNetworks=[];
let bleStatusText='BLE not connected';
const bleDecoder=new TextDecoder(),bleEncoder=new TextEncoder();
function bleStatus(text){bleStatusText=text;const el=document.querySelector('#ble-status');if(el)el.textContent=text}
function bleJson(event){try{return JSON.parse(bleDecoder.decode(event.target.value))}catch{return null}}
function handleBlePacket(event){const value=bleJson(event);if(!value)return;if(value.type==='wifi_network'){bleNetworks.push(value.network);const el=document.querySelector('#ble-networks');if(el)el.textContent=JSON.stringify(bleNetworks,null,2)}else if(value.wifi)bleStatus('BLE status: '+value.wifi.state+(value.wifi.error?' — '+value.wifi.error:''))}
async function bleConnect(){try{if(!window.isSecureContext||!navigator.bluetooth)throw Error('Web Bluetooth requires HTTPS or localhost in Chrome/Edge.');if(bleDevice?.gatt?.connected)bleDevice.gatt.disconnect();bleConfigChar=null;bleStatus('Opening Windows Bluetooth picker — select A8-......');bleDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE_UUID.service]});bleDevice.addEventListener('gattserverdisconnected',()=>{bleConfigChar=null;bleStatus('BLE disconnected — reconnect to configure Wi-Fi')});const server=await bleDevice.gatt.connect();const service=await server.getPrimaryService(BLE_UUID.service);bleConfigChar=await service.getCharacteristic(BLE_UUID.config);const statusChar=await service.getCharacteristic(BLE_UUID.status);const networksChar=await service.getCharacteristic(BLE_UUID.networks);statusChar.addEventListener('characteristicvaluechanged',handleBlePacket);networksChar.addEventListener('characteristicvaluechanged',handleBlePacket);await statusChar.startNotifications();await networksChar.startNotifications();const identity=await (await service.getCharacteristic(BLE_UUID.identity)).readValue();bleStatus('Connected: '+bleDecoder.decode(identity));}catch(e){bleStatus('BLE error: '+e.message)}}
async function bleWrite(payload){if(!bleConfigChar)throw Error('Connect to an Air8000 over BLE first.');await bleConfigChar.writeValueWithResponse(bleEncoder.encode(JSON.stringify(payload)))}
async function bleScan(){try{bleNetworks=[];const el=document.querySelector('#ble-networks');if(el)el.textContent='Scanning…';await bleWrite({pairing_code:document.querySelector('#ble-pairing').value,op:'scan'});bleStatus('BLE scan requested; waiting for networks…')}catch(e){bleStatus('BLE error: '+e.message)}}
async function bleConnectWifi(){try{await bleWrite({pairing_code:document.querySelector('#ble-pairing').value,op:'connect',ssid:document.querySelector('#wifi-ssid').value,password:document.querySelector('#wifi-password').value,bssid:document.querySelector('#wifi-bssid').value,security:document.querySelector('#wifi-security').value});bleStatus('BLE Wi-Fi credentials sent; waiting for connection…')}catch(e){bleStatus('BLE error: '+e.message)}}
function createVoiceState(){
  return {
    ws:null,ctx:null,stream:null,source:null,processor:null,micHighPass:null,micLowPass:null,muteNode:null,
    playNode:null,playModuleUrl:null,useWorklet:false,nextPlay:0,downlinkRate:8000,uplinkRate:8000,
    pending:new Int16Array(0),downlinkPackets:0,playQueue:[],playStarted:false,playUnderruns:0,
    playDrops:0,workletPending:new Float32Array(0),targetLead:0.36,minLead:0.20,maxLead:0.80,wantActive:false,deviceID:null,
    reconnectTask:null,reconnectToken:0,lastDownlinkAt:0,mediaConnectedAt:0,watchdog:null,
    socketGeneration:0,ticket:null
  };
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function refresh(){
  const wanted=voice.deviceID||select.value;
  try{
    devices=await api('/api/devices');
    select.innerHTML=devices.map(d=>'<option value="'+esc(d.device_id)+'">'+esc(d.device_id)+' — '+(d.connected?'online':'offline')+'</option>').join('');
    if(!devices.length)select.innerHTML='<option value="">No device</option>';
    else if(wanted&&devices.some(d=>d.device_id===wanted))select.value=wanted;
    // Avoid rebuilding the phone panel every second during an active call.
    // Media events update voice status directly; render again when audio stops.
    if(!voice.wantActive){render();showVoiceMode()}
  }catch(e){
    if(!voice.wantActive)write(e.message);
  }
}
function voiceStatus(text){voiceStatusText=text;const el=document.querySelector('#voice-status');if(el)el.textContent=text}
function showVoiceMode(){const d=current(),host=document.querySelector('#overview .card');if(!d||!host)return;const box=document.createElement('div');box.className='status';box.style.marginTop='10px';const mode=d.voice_mode||((d.media_backend==='sip_bridge')?'compatible':(d.media_backend==='direct_pcm'?'wideband':'unknown'));box.innerHTML='<b>Voice mode</b><br><select disabled><option>'+esc(mode)+'</option></select> '+(mode==='compatible'?'SIP bridge · carrier early media · PCMU 8 kHz':'Direct PCM · starts after connect · '+(d.media_rate||8000)+' Hz');host.appendChild(box)}
function applyVoiceRate(downlink,uplink){
  voice.downlinkRate=Number(downlink)===16000?16000:8000;
  voice.uplinkRate=Number(uplink)===16000?16000:8000;
  voice.micResampler=null;voice.playResampler=null;resetPlaybackQueue();
  if(voice.micLowPass)voice.micLowPass.frequency.value=voice.uplinkRate===16000?7000:3400;
}
// Streaming area-average decimator for the microphone (e.g. 48k/44.1k -> 16k).
// The fractional position carries across ScriptProcessor blocks, so the
// output rate is exact (1024/3 is not an integer) and blocks join seamlessly.
function makeDecimator(fromRate,toRate){
  const ratio=fromRate/toRate;let acc=0,weight=0;
  return {fromRate,toRate,run(input){
    const out=new Int16Array(Math.ceil((input.length+weight)/ratio)+1);let n=0;
    for(let i=0;i<input.length;i++){
      const s=input[i];let remain=1;
      while(weight+remain>=ratio){const take=ratio-weight;acc+=s*take;out[n++]=Math.max(-1,Math.min(1,acc/ratio))*0x7fff;acc=0;weight=0;remain-=take}
      acc+=s*remain;weight+=remain;
    }
    return out.slice(0,n).buffer;
  }};
}
function downsample(input,fromRate,toRate){
  if(!voice.micResampler||voice.micResampler.fromRate!==fromRate||voice.micResampler.toRate!==toRate)voice.micResampler=makeDecimator(fromRate,toRate);
  return voice.micResampler.run(input);
}
// Streaming linear interpolator for playback (16k -> AudioContext rate). The
// previous frame's last sample and the fractional phase carry over, so 20 ms
// frames no longer end on a held sample (an audible 50 Hz roughness).
function makeInterpolator(fromRate,toRate){
  const step=fromRate/toRate;let pos=0;
  return {fromRate,toRate,run(input){
    if(!input.length)return new Float32Array(0);
    // Emit exactly input.length * toRate / fromRate samples. The final
    // fractional samples use a one-sample linear extrapolation so the next
    // frame starts on time instead of losing samples and draining playback.
    const out=new Float32Array(Math.ceil((input.length-pos)/step)+1);let n=0;
    while(pos<input.length-1e-7){
      const i=Math.floor(pos),f=pos-i;
      const a=input[Math.min(i,input.length-1)];
      const next=i+1<input.length?input[i+1]:a+(i>0?a-input[i-1]:0);
      out[n++]=(a*(1-f)+next*f)/32768;pos+=step;
    }
    pos-=input.length;
    if(Math.abs(pos)<1e-6)pos=0;
    return out.slice(0,n);
  }};
}
function pcm16ToContext(buffer,fromRate,toRate){
  const input=new Int16Array(buffer);
  if(!input.length)return new Float32Array(0);
  if(!voice.playResampler||voice.playResampler.fromRate!==fromRate||voice.playResampler.toRate!==toRate)voice.playResampler=makeInterpolator(fromRate,toRate);
  return voice.playResampler.run(input);
}
async function setupPlaybackWorklet(){
  if(!voice.ctx?.audioWorklet||typeof AudioWorkletNode==='undefined')return false;
  const source=[
    "class AirSIMPlaybackProcessor extends AudioWorkletProcessor {",
    " constructor(){super();this.q=[];this.offset=0;this.buffered=0;this.started=false;this.target=Math.round(sampleRate*0.36);this.max=Math.round(sampleRate*0.80);this.underruns=0;this.dropped=0;this.port.onmessage=e=>this.msg(e.data||{});}",
    " msg(m){if(m.type==='reset'){this.q=[];this.offset=0;this.buffered=0;this.started=false;return;}if(m.type!=='pcm'||!m.samples)return;const a=new Float32Array(m.samples);while(this.buffered+a.length>this.max&&this.q.length){const first=this.q.shift();this.buffered-=Math.max(0,first.length-this.offset);this.offset=0;this.dropped++;}this.q.push(a);this.buffered+=a.length;if(!this.started&&this.buffered>=this.target)this.started=true;if((this.dropped&15)===1)this.port.postMessage({type:'drop',count:this.dropped});}",
    " process(inputs,outputs){const out=outputs[0]&&outputs[0][0];if(!out)return true;out.fill(0);if(!this.started)return true;let i=0;while(i<out.length){if(!this.q.length){this.underruns++;this.port.postMessage({type:'underrun',count:this.underruns});break;}const a=this.q[0];const n=Math.min(out.length-i,a.length-this.offset);out.set(a.subarray(this.offset,this.offset+n),i);i+=n;this.offset+=n;this.buffered-=n;if(this.offset>=a.length){this.q.shift();this.offset=0;}}return true;}",
    "}",
    "registerProcessor('airsim-playback',AirSIMPlaybackProcessor);"
  ].join("\n");
  const url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
  try{
    await voice.ctx.audioWorklet.addModule(url);
    const node=new AudioWorkletNode(voice.ctx,'airsim-playback',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
    node.port.onmessage=e=>{
      if(e.data?.type==='underrun')voice.playUnderruns=Number(e.data.count)||voice.playUnderruns+1;
      if(e.data?.type==='drop')voice.playDrops=Number(e.data.count)||voice.playDrops+1;
    };
    node.connect(voice.ctx.destination);
    voice.playNode=node;
    voice.playModuleUrl=url;
    voice.useWorklet=true;
    return true;
  }catch(e){
    URL.revokeObjectURL(url);
    return false;
  }
}
function resetPlaybackQueue(){
  voice.playResampler=null;
  voice.playQueue=[];
  voice.workletPending=new Float32Array(0);
  voice.playStarted=false;
  voice.nextPlay=0;
  if(voice.playNode)voice.playNode.port.postMessage({type:'reset'});
}
function sendMicPcm(buffer){
  if(!voice.ws||voice.ws.readyState!==WebSocket.OPEN)return;
  const incoming=new Int16Array(buffer);
  const pending=voice.pending||new Int16Array(0);
  const merged=new Int16Array(pending.length+incoming.length);
  merged.set(pending);merged.set(incoming,pending.length);
  const frameSamples=Math.max(160,Math.round(voice.uplinkRate*0.02));
  let offset=0;
  while(offset+frameSamples<=merged.length){
    voice.ws.send(merged.slice(offset,offset+frameSamples).buffer);
    offset+=frameSamples;
  }
  voice.pending=merged.slice(offset);
}
async function playPcm(buffer){
  if(!voice.ctx||!(buffer instanceof ArrayBuffer)||buffer.byteLength<2)return;
  if(voice.ctx.state!=='running')await voice.ctx.resume();
  if(voice.useWorklet&&voice.playNode){
    const samples=pcm16ToContext(buffer,voice.downlinkRate,voice.ctx.sampleRate);
    const pending=voice.workletPending||new Float32Array(0);
    const merged=new Float32Array(pending.length+samples.length);
    merged.set(pending);merged.set(samples,pending.length);
    // Keep transport-to-worklet blocks at one 20 ms frame. Larger 40 ms
    // messages make speech arrive in audible chunks even when the queue is
    // otherwise healthy.
    const batch=Math.max(samples.length,Math.round(voice.ctx.sampleRate*0.02));
    let offset=0;
    while(merged.length-offset>=batch){
      const chunk=merged.slice(offset,offset+batch);
      voice.playNode.port.postMessage({type:'pcm',samples:chunk.buffer},[chunk.buffer]);
      offset+=batch;
    }
    voice.workletPending=merged.slice(offset);
    return;
  }
  // Compatibility fallback for browsers without AudioWorklet.
  voice.playQueue.push(new Int16Array(buffer));
  const frameSeconds=(buffer.byteLength/2)/voice.downlinkRate;
  const warmupFrames=Math.max(5,Math.ceil(voice.targetLead/Math.max(frameSeconds,0.02)));
  if(!voice.playStarted&&voice.playQueue.length<warmupFrames)return;
  const now=voice.ctx.currentTime;
  if(!voice.playStarted){voice.nextPlay=now+voice.targetLead;voice.playStarted=true}
  else if(voice.nextPlay<now+voice.minLead){voice.playUnderruns++;voice.nextPlay=now+voice.targetLead}
  while(voice.playQueue.length&&voice.nextPlay<now+voice.maxLead){
    const samples=voice.playQueue.shift();
    const audio=voice.ctx.createBuffer(1,samples.length,voice.downlinkRate);
    const channel=audio.getChannelData(0);
    for(let i=0;i<samples.length;i++)channel[i]=samples[i]/32768;
    const src=voice.ctx.createBufferSource();
    src.buffer=audio;src.connect(voice.ctx.destination);src.start(voice.nextPlay);voice.nextPlay+=audio.duration;
  }
}
async function openMediaSocket(deviceID,reconnecting=false){
  const token=++voice.socketGeneration;
  // Invalidate the previous socket before opening its replacement. Otherwise
  // the old socket can continue delivering PCM while the new socket is
  // connecting, which produces a short double-layer/echo during recovery.
  const old=voice.ws;
  if(old){
    voice.ws=null;
    try{old.close(4000,'replaced-before-connect')}catch{}
  }
  const ticket=await api('/api/devices/'+encodeURIComponent(deviceID)+'/media-ticket',{method:'POST'});
  if(!voice.wantActive||token!==voice.socketGeneration)throw Error('voice session changed');
  applyVoiceRate(ticket.downlink_sample_rate||ticket.sample_rate,ticket.uplink_sample_rate||ticket.sample_rate);
  voice.ticket=ticket;
  voice.pending=new Int16Array(0);
  voice.micResampler=null;
  resetPlaybackQueue();

  const ws=new WebSocket(ticket.ws_url);
  ws.binaryType='arraybuffer';
  await new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>{try{ws.close()}catch{};reject(Error('media WebSocket timeout'))},5000);
    ws.onopen=()=>{clearTimeout(timer);resolve()};
    ws.onerror=()=>{clearTimeout(timer);reject(Error('media WebSocket failed'))};
    ws.onclose=()=>{clearTimeout(timer);reject(Error('media WebSocket closed during connect'))};
  });
  if(!voice.wantActive||token!==voice.socketGeneration){try{ws.close()}catch{};throw Error('voice session changed')}
  voice.ws=ws;
  voice.mediaConnectedAt=Date.now();
  voice.lastDownlinkAt=0;
  ws.onmessage=async e=>{
    if(voice.ws!==ws)return;
    let data=e.data;
    if(data instanceof Blob)data=await data.arrayBuffer();
    if(data instanceof ArrayBuffer){
      voice.downlinkPackets++;
      voice.lastDownlinkAt=Date.now();
      if(voice.downlinkPackets===1||reconnecting){
        const live=devices.find(x=>x.device_id===deviceID);
        const cellular=live?.cellular_voice_rate||0;
        voiceStatus((reconnecting?'Voice media restored':'Receiving carrier/bridge media')+' · RTP '+voice.downlinkRate+' Hz'+(cellular?' · cellular '+cellular+' Hz '+(live?.voice_codec||''):'')+' · continuous buffered playback');
        reconnecting=false;
      }
      try{await playPcm(data)}catch(err){voiceStatus('Speaker error: '+err.message)}
    } else if(typeof data==='string') {
      try {
        const message=JSON.parse(data),p=message.payload||{};
        if(message.type==='media.transport_change') {
          applyVoiceRate(p.downlink_sample_rate||p.sample_rate,p.uplink_sample_rate||p.sample_rate);
          voiceStatus('Connected voice · '+voice.downlinkRate+' Hz · '+(p.wideband?'WIDEBAND':'NARROWBAND')+' · direct PCM');
        }
      } catch {}
    }
  };
  ws.onerror=()=>{};
  ws.onclose=event=>{
    if(voice.ws!==ws)return;
    voice.ws=null;
    if(event.code===4001){
      voice.wantActive=false;
      voice.reconnectToken++;
      voiceStatus('Carrier call ended');
      stopVoice().catch(()=>{});
      return;
    }
    if(voice.wantActive)scheduleMediaReconnect('media socket disconnected');
  };
  return ticket;
}
function scheduleMediaReconnect(reason){
  if(!voice.wantActive||voice.reconnectTask)return;
  const token=++voice.reconnectToken;
  const deadline=Date.now()+45000;
  voiceStatus('Voice media reconnecting — '+reason);
  voice.reconnectTask=(async()=>{
    let delay=100;
    let attempt=0;
    while(voice.wantActive&&token===voice.reconnectToken&&Date.now()<deadline){
      if(attempt++)await sleep(delay);
      try{
        await openMediaSocket(voice.deviceID,true);
        voiceStatus('Voice media restored automatically');
        return;
      }catch(e){
        delay=Math.min(2500,Math.round(delay*1.6));
      }
    }
    if(voice.wantActive&&token===voice.reconnectToken)voiceStatus('Voice recovery timed out — call is still active; press audio/call again to retry');
  })().finally(()=>{if(token===voice.reconnectToken)voice.reconnectTask=null});
}
function startLocalRingback(){
  if(voice.ringbackTimer||!voice.ctx)return;
  const osc=voice.ctx.createOscillator(),gain=voice.ctx.createGain();
  osc.type='sine';osc.frequency.value=440;gain.gain.value=0;osc.connect(gain);gain.connect(voice.ctx.destination);osc.start();
  let on=false;const tick=()=>{on=!on;gain.gain.setTargetAtTime(on?0.035:0,voice.ctx.currentTime,0.015)};
  tick();voice.ringbackOsc=osc;voice.ringbackGain=gain;voice.ringbackTimer=setInterval(tick,2000);
}
function stopLocalRingback(){
  if(voice.ringbackTimer)clearInterval(voice.ringbackTimer);voice.ringbackTimer=null;
  if(voice.ringbackGain&&voice.ctx)voice.ringbackGain.gain.setTargetAtTime(0,voice.ctx.currentTime,0.01);
  if(voice.ringbackOsc)try{voice.ringbackOsc.stop(voice.ctx.currentTime+0.03)}catch{};
  voice.ringbackOsc=null;voice.ringbackGain=null;
}
function startVoiceWatchdog(){
  if(voice.watchdog)clearInterval(voice.watchdog);
  voice.watchdog=setInterval(()=>{
    if(!voice.wantActive)return;
    const ws=voice.ws;
    if(!ws||ws.readyState!==WebSocket.OPEN)return;
    if(activeCallState==='IDLE'||activeCallState==='ENDED')return;
    // Do not reconnect merely because an unanswered call has no media yet.
    // Recovery is valid only after media was received and then stopped.
    const reference=voice.lastDownlinkAt;
    // A quiet carrier stream is not proof that the WebSocket is broken.
    // Only recover after a real stream has delivered enough media and then
    // stayed silent for a long interval; socket close still handles network
    // failures immediately.
    if(voice.downlinkPackets>=50&&reference&&Date.now()-reference>30000){
      voiceStatus('Media stalled — recovering automatically…');
      try{ws.close(4001,'media-stalled')}catch{}
    }
  },1000);
}
async function startVoice(){
  const d=current();
  if(!d)throw Error('Select a connected Air8000 device first.');
  try{
    if(voice.wantActive||voice.ctx)await stopVoice();
    voice=createVoiceState();
    voice.wantActive=true;
    voice.deviceID=d.device_id;
    voiceStatus('Starting microphone / speaker…');
    if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone requires HTTPS or http://localhost:8081.');
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)throw Error('Web Audio is unavailable');

    voice.ctx=new AudioContextClass({latencyHint:'interactive'});
    await voice.ctx.resume();
    await setupPlaybackWorklet();
    voice.stream=await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:{ideal:1},sampleRate:{ideal:48000},sampleSize:{ideal:16},
      echoCancellation:true,noiseSuppression:true,autoGainControl:true
    }});
    voice.source=voice.ctx.createMediaStreamSource(voice.stream);
    voice.micHighPass=voice.ctx.createBiquadFilter();
    voice.micHighPass.type='highpass';voice.micHighPass.frequency.value=80;voice.micHighPass.Q.value=0.707;
    voice.micLowPass=voice.ctx.createBiquadFilter();
    voice.micLowPass.type='lowpass';voice.micLowPass.frequency.value=voice.uplinkRate===16000?7000:3400;voice.micLowPass.Q.value=0.707;
    voice.processor=voice.ctx.createScriptProcessor(1024,1,1);
    voice.processor.onaudioprocess=e=>sendMicPcm(downsample(e.inputBuffer.getChannelData(0),voice.ctx.sampleRate,voice.uplinkRate));
    voice.muteNode=voice.ctx.createGain();voice.muteNode.gain.value=0;
    voice.source.connect(voice.micHighPass);voice.micHighPass.connect(voice.micLowPass);voice.micLowPass.connect(voice.processor);voice.processor.connect(voice.muteNode);voice.muteNode.connect(voice.ctx.destination);

    const ticket=await openMediaSocket(d.device_id,false);
    startVoiceWatchdog();
    voiceStatus((ticket.real_early_media?'Carrier/phone media ready':'Live two-way voice connected')+' · continuous AudioWorklet buffer · automatic 45 s recovery');
  }catch(e){
    await stopVoice();
    voiceStatus('Voice error: '+e.message);
    throw e;
  }
}
async function stopVoice(){
  const old=voice;
  stopLocalRingback();
  old.wantActive=false;
  old.reconnectToken++;
  old.socketGeneration++;
  if(old.watchdog)clearInterval(old.watchdog);
  if(old.ws)try{old.ws.close(1000,'voice-stop')}catch{}
  if(old.processor)try{old.processor.disconnect()}catch{}
  if(old.source)try{old.source.disconnect()}catch{}
  if(old.micHighPass)try{old.micHighPass.disconnect()}catch{}
  if(old.micLowPass)try{old.micLowPass.disconnect()}catch{}
  if(old.muteNode)try{old.muteNode.disconnect()}catch{}
  if(old.playNode)try{old.playNode.disconnect()}catch{}
  if(old.stream)old.stream.getTracks().forEach(t=>t.stop());
  if(old.ctx)try{await old.ctx.close()}catch{}
  if(old.playModuleUrl)URL.revokeObjectURL(old.playModuleUrl);
  voice=createVoiceState();
  voiceStatus('Voice bridge stopped');
  setTimeout(refresh,0);
}
