services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN}"
      ENROLLMENT_TOKEN: "${ENROLLMENT_TOKEN:?set ENROLLMENT_TOKEN}"
      DEVICE_CA_CERT: "/data/pki/device-ca.pem"
      DEVICE_CA_KEY: "/data/pki/device-ca-key.pem"
      DEVICE_REGISTRY_JSON: "${DEVICE_REGISTRY_JSON:?set DEVICE_REGISTRY_JSON}"
      RTP_PUBLIC_HOST: "${RTP_PUBLIC_HOST:?set RTP_PUBLIC_HOST}"
      RTP_PORT_BASE: "${RTP_PORT_BASE:-41000}"
      RTP_PORT_COUNT: "${RTP_PORT_COUNT:-64}"
      # iOS app cloud Relay (/ios/<IOS_ACCESS_TOKEN>/v1/...); empty disables it.
      IOS_ACCESS_TOKEN: "${IOS_ACCESS_TOKEN:-}"
      IOS_PUBLIC_URL: "${IOS_PUBLIC_URL:-}"
      IOS_AIR8000_DEVICE_ID: "${IOS_AIR8000_DEVICE_ID:-}"
      ALLOWED_BUNDLE_ID: "${ALLOWED_BUNDLE_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_P8: "${APNS_P8:-}"
    expose: ["8080"]
    ports:
      - "41000-41063:41000-41063/udp"
    volumes:
      - gateway_data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN}"
      DEVICE_DOMAIN: "${DEVICE_DOMAIN:?set DEVICE_DOMAIN}"
      ENROLL_DOMAIN: "${ENROLL_DOMAIN:?set ENROLL_DOMAIN}"
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - gateway_data:/data/pki:ro
volumes:
  caddy_data:
  caddy_config:
  gateway_data:
